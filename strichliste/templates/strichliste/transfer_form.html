{% extends "abfrage/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Geld überweisen{% endblock %}

{% block content %}
<p class="text-muted">Von <strong>{{ account.name }}</strong> an eine andere Person, z.B. wenn jemand für dich bezahlt hat.</p>
<form method="post" style="max-width: 32rem">{% csrf_token %}
 {{ form|crispy }}
 <button type="submit" class="btn btn-primary">Überweisen</button>
 <a class="btn btn-link" href="{% if pin %}{% url 'strichliste:tablet_account' pin account.pk %}{% else %}{% url 'strichliste:start' %}{% endif %}">Abbrechen</a>
</form>
{% endblock %}
