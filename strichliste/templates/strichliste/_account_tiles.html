{% load strichliste %}
<div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
 {% for account in accounts %}
 <div class="col">
  <a class="card h-100 text-decoration-none{% if account.debt %} border-danger border-3{% endif %}"
     href="{% url 'strichliste:tablet_account' pin account.pk %}">
   <div class="card-body d-flex flex-column p-2">
    <div class="fw-bold text-truncate" title="{{ account.name }}">{{ account.name }}</div>
    <div>{% for tag in account.tags.all %} <span class="small text-muted">{{ tag.label }}</span>{% endfor %}</div>
    <div class="mt-auto text-end fw-bold fs-5 {{ account.balance|balance_class }}">{{ account.balance|euro }}</div>
   </div>
  </a>
 </div>
 {% endfor %}
</div>
